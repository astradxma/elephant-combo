<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Combo in iframe</title>
<!-- e2e host: the fixture inside a short same-origin iframe, as an external
     surface is mounted in a case page. The popup must flip and fit inside the frame. -->
<style> body { margin: 0; font: 14px system-ui; } iframe { width: 520px; height: 420px; border: 1px solid #999; margin: 40px; } </style>
</head>
<body><iframe id="frame" src="fixture.html?layout=plain"></iframe></body>
</html>
